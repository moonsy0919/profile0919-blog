<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>날씨 헤더</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header data-weather="{{weather}}" data-time="{{timeKey}}" style="position: relative; width: 100%; min-height: 200px; overflow: hidden; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; text-shadow: 0 1px 10px rgba(0, 0, 0, 0.22); background: {{sky}}">

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; opacity: {{starsOp}}">
    <sc-for list="{{stars}}" as="st" hint-placeholder-count="0">
      <div style="position: absolute; border-radius: 50%; background: #ffffff; {{st.style}}"></div>
    </sc-for>
  </div>

  <sc-if value="{{showGlow}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: absolute; width: 260px; height: 260px; margin: -130px 0 0 -130px; border-radius: 50%; pointer-events: none; {{glowStyle}}"></div>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{clouds}}" as="cl" hint-placeholder-count="0">
      <div style="position: absolute; border-radius: 50%; filter: blur(26px); {{cl.style}}"></div>
    </sc-for>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{fog}}" as="fg" hint-placeholder-count="0">
      <div style="position: absolute; border-radius: 999px; filter: blur(16px); {{fg.style}}"></div>
    </sc-for>
  </div>

  <sc-if value="{{hasFlash}}" hint-placeholder-val="{{false}}">
    <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
      <rect width="100%" height="100%" fill="#E9E6FF" opacity="0">
        <animate attributeName="opacity" values="0;0;0.5;0.05;0.35;0" keyTimes="0;0.86;0.88;0.9;0.92;1" dur="7s" repeatCount="indefinite"></animate>
      </rect>
    </svg>
    <svg aria-hidden="true" width="70" height="150" viewBox="0 0 70 150" style="position: absolute; left: 58%; top: 0; pointer-events: none">
      <path d="M40 0 22 62h16L18 150 52 50H36L48 0Z" fill="#FFF6C8" opacity="0">
        <animate attributeName="opacity" values="0;0;1;0;0.8;0" keyTimes="0;0.86;0.88;0.9;0.92;1" dur="7s" repeatCount="indefinite"></animate>
      </path>
    </svg>
  </sc-if>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{drops}}" as="dr" hint-placeholder-count="0">
      <svg width="4" height="200" viewBox="0 0 4 200" style="position: absolute; top: 0; overflow: visible; left: {{dr.left}}">
        <line x1="2" y1="0" x2="{{dr.x2}}" y2="{{dr.len}}" stroke="{{dr.stroke}}" stroke-width="{{dr.sw}}" stroke-linecap="round">
          <animateTransform attributeName="transform" type="translate" from="{{dr.from}}" to="{{dr.to}}" dur="{{dr.dur}}" begin="{{dr.begin}}" repeatCount="indefinite"></animateTransform>
        </line>
      </svg>
    </sc-for>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <sc-for list="{{flakes}}" as="fl" hint-placeholder-count="0">
      <svg width="8" height="200" viewBox="0 0 8 200" style="position: absolute; top: 0; overflow: visible; left: {{fl.left}}">
        <circle cx="4" cy="0" r="{{fl.r}}" fill="rgba(255, 255, 255, 0.9)">
          <animateTransform attributeName="transform" type="translate" from="0 -10" to="{{fl.to}}" dur="{{fl.dur}}" begin="{{fl.begin}}" repeatCount="indefinite"></animateTransform>
        </circle>
      </svg>
    </sc-for>
  </div>

  <div style="position: relative; max-width: 1200px; min-height: 200px; margin: 0 auto; padding: 28px clamp(20px, 4vw, 48px); box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 20px 40px">
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, 0.9)">
        <span style="padding: 3px 10px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); font-weight: 600">{{timeLabel}}</span>
        <span>{{dateLabel}}</span>
      </div>
      <div style="font-size: clamp(40px, 5.5vw, 60px); font-weight: 300; line-height: 1.1; letter-spacing: -0.01em">{{time}}</div>
      <div style="font-size: 16px; font-weight: 500; color: rgba(255, 255, 255, 0.92)">{{greeting}}</div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px">
      <sc-if value="{{ic.sun}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6.5" fill="#FFD23F"></circle><path d="M16 3.5v3.5M16 25v3.5M3.5 16H7M25 16h3.5M7.2 7.2l2.5 2.5M22.3 22.3l2.5 2.5M7.2 24.8l2.5-2.5M22.3 9.7l2.5-2.5" stroke="#FFD23F" stroke-width="2.2" stroke-linecap="round" fill="none"></path></svg></sc-if>
      <sc-if value="{{ic.moon}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M20 4.5A11.5 11.5 0 1 0 27.5 20 9 9 0 0 1 20 4.5Z" fill="#EDEBDD"></path></svg></sc-if>
      <sc-if value="{{ic.partSun}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#FFD23F"></circle><path d="M12 3v2.5M3 12h2.5M5.6 5.6l1.8 1.8M18.4 5.6l-1.8 1.8" stroke="#FFD23F" stroke-width="2" stroke-linecap="round" fill="none"></path><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(3 3) scale(0.88)" fill="#FFFFFF"></path></svg></sc-if>
      <sc-if value="{{ic.partMoon}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M13 3.5A8 8 0 1 0 19.5 14 6.3 6.3 0 0 1 13 3.5Z" fill="#EDEBDD"></path><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(3 3) scale(0.88)" fill="#F2F5F9"></path></svg></sc-if>
      <sc-if value="{{ic.cloud}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" fill="#F2F5F9"></path></svg></sc-if>
      <sc-if value="{{ic.clouds}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(7 -3) scale(0.78)" fill="#AEB8C6"></path><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(-1.5 1)" fill="#DCE2EA"></path></svg></sc-if>
      <sc-if value="{{ic.fog}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(0 -6)" fill="#E6ECF4"></path><path d="M5 23.5h22M8.5 27.5h15" stroke="#E6ECF4" stroke-width="2.2" stroke-linecap="round" fill="none"></path></svg></sc-if>
      <sc-if value="{{ic.drizzle}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(0 -4)" fill="#E6ECF4"></path><path d="M11 24.5v1.4M16.5 26.5v1.4M22 24.5v1.4" stroke="#8FD8FF" stroke-width="2.2" stroke-linecap="round" fill="none"></path></svg></sc-if>
      <sc-if value="{{ic.rain}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(0 -4)" fill="#E6ECF4"></path><path d="M11 24.5l-1.6 3.5M16.5 24.5l-1.6 3.5M22 24.5l-1.6 3.5" stroke="#5AC8FA" stroke-width="2.2" stroke-linecap="round" fill="none"></path></svg></sc-if>
      <sc-if value="{{ic.shower}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(0 -5)" fill="#D5DDE8"></path><path d="M10 23l-2.2 5.5M14.5 23l-2.2 5.5M19 23l-2.2 5.5M23.5 23l-2.2 5.5" stroke="#5AC8FA" stroke-width="2" stroke-linecap="round" fill="none"></path></svg></sc-if>
      <sc-if value="{{ic.thunder}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(0 -5)" fill="#C3CCD8"></path><path d="M17 18.5l-4.5 6.5h3.5l-2 6 6-8h-3.6l2.1-4.5Z" fill="#FFD23F"></path></svg></sc-if>
      <sc-if value="{{ic.snow}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(0 -4)" fill="#E6ECF4"></path><circle cx="10.5" cy="26" r="1.6" fill="#FFFFFF"></circle><circle cx="16" cy="28.5" r="1.6" fill="#FFFFFF"></circle><circle cx="21.5" cy="26" r="1.6" fill="#FFFFFF"></circle></svg></sc-if>
      <sc-if value="{{ic.sleet}}" hint-placeholder-val="{{false}}"><svg width="68" height="68" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 25.5h14.5a5.5 5.5 0 0 0 .4-11A7.5 7.5 0 0 0 9.6 15.2 5.2 5.2 0 0 0 9 25.5Z" transform="translate(0 -4)" fill="#E6ECF4"></path><path d="M11 24.5l-1.6 3.5M22 24.5l-1.6 3.5" stroke="#5AC8FA" stroke-width="2.2" stroke-linecap="round" fill="none"></path><circle cx="16" cy="27" r="1.7" fill="#FFFFFF"></circle></svg></sc-if>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-size: clamp(40px, 5vw, 54px); font-weight: 300; line-height: 1">{{temp}}°</div>
        <div style="font-size: 16px; font-weight: 600">{{weatherLabel}} · 서울</div>
        <div style="font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, 0.88)">최고 {{hi}}° · 최저 {{lo}}°</div>
      </div>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"live":{"editor":"boolean","default":true,"section":"시간"},"hour":{"editor":"range","min":0,"max":23.75,"step":0.25,"default":8,"unit":"시","section":"시간"},"weather":{"editor":"enum","options":["clear","few-clouds","scattered-clouds","overcast","mist","drizzle","rain","shower","thunderstorm","snow","sleet"],"default":"clear","section":"날씨"},"$preview":{"width":1280,"height":200}}'>
class Component extends DCLogic {
  componentDidMount() {
    this._timer = setInterval(() => this.setState({ tick: Date.now() }), 20000);
  }
  componentWillUnmount() { clearInterval(this._timer); }
  kst() {
    const f = new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', hour12: false, hour: '2-digit', minute: '2-digit', weekday: 'short', month: 'numeric', day: 'numeric' });
    const p = {};
    f.formatToParts(new Date()).forEach((x) => { p[x.type] = x.value; });
    return { h: Number(p.hour) % 24, m: Number(p.minute), mo: Number(p.month), d: Number(p.day), dow: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday) };
  }
  hex(c) { const n = parseInt(c.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  mix(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }
  rgb(a) { return 'rgb(' + a.map((v) => Math.round(Math.max(0, Math.min(255, v)))).join(', ') + ')'; }
  renderVals() {
    const p = this.props;
    const live = p.live ?? true;
    const k = this.kst();
    let hf = live ? k.h + k.m / 60 : Number(p.hour ?? 8);
    if (!(hf >= 0 && hf < 24)) hf = 8;

    // 시간대 (TimeKey): dawn 4–7 · morning 7–11 · noon 11–14 · afternoon 14–17 · evening 17–20 · night 20–4
    const T = {
      dawn: { ko: '새벽', sky: ['#151C44', '#3E4483', '#C98B8A'], hello: '고요한 새벽이에요' },
      morning: { ko: '아침', sky: ['#2A6FBF', '#4F90D6', '#D9B48F'], hello: '좋은 아침이에요' },
      noon: { ko: '점심', sky: ['#1C6FD1', '#3D8FE0', '#7DB9EE'], hello: '맛있는 점심 드세요' },
      afternoon: { ko: '오후', sky: ['#2766B8', '#4C88D2', '#9CBFE6'], hello: '나른한 오후, 힘내세요' },
      evening: { ko: '저녁', sky: ['#262B66', '#874A7E', '#E58A62'], hello: '편안한 저녁 보내세요' },
      night: { ko: '밤', sky: ['#060A1E', '#0F1838', '#1C2A55'], hello: '오늘 하루도 수고했어요' }
    };
    const timeKey = hf >= 4 && hf < 7 ? 'dawn' : hf >= 7 && hf < 11 ? 'morning' : hf >= 11 && hf < 14 ? 'noon' : hf >= 14 && hf < 17 ? 'afternoon' : hf >= 17 && hf < 20 ? 'evening' : 'night';
    const dark = timeKey === 'night' || timeKey === 'dawn';

    // 날씨 (WeatherKey): tone = [회색 섞기, 밝기], clouds = 구름 밀도, drops/flakes = 강수 효과
    const W = {
      'clear': { ko: '맑음', tone: [0, 1], clouds: 0, glow: 1, stars: 1, drops: null, flakes: 0, tip: dark ? '하늘이 맑아요' : '햇살이 좋은 날이에요', lohi: [13, 22] },
      'few-clouds': { ko: '구름 조금', tone: [0.12, 0.98], clouds: 1, glow: 0.8, stars: 0.7, drops: null, flakes: 0, tip: '구름이 조금 있는 맑은 날이에요', lohi: [13, 21] },
      'scattered-clouds': { ko: '구름 많음', tone: [0.32, 0.94], clouds: 2, glow: 0.45, stars: 0.35, drops: null, flakes: 0, tip: '구름이 많지만 비 소식은 없어요', lohi: [14, 20] },
      'overcast': { ko: '흐림', tone: [0.62, 0.85], clouds: 3, glow: 0, stars: 0.1, drops: null, flakes: 0, tip: '하늘이 잔뜩 흐려요', lohi: [14, 19] },
      'mist': { ko: '안개', tone: [0.66, 0.92], clouds: 0, fog: true, glow: 0, stars: 0.05, drops: null, flakes: 0, tip: '안개가 꼈어요, 운전 조심하세요', lohi: [11, 18] },
      'drizzle': { ko: '이슬비', tone: [0.58, 0.8], clouds: 3, glow: 0, stars: 0, drops: 'drizzle', flakes: 0, tip: '이슬비가 내려요, 작은 우산을 챙기세요', lohi: [13, 17] },
      'rain': { ko: '비', tone: [0.75, 0.64], clouds: 3, dim: true, glow: 0, stars: 0, drops: 'rain', flakes: 0, tip: '우산을 꼭 챙기세요', lohi: [12, 16] },
      'shower': { ko: '소나기', tone: [0.6, 0.7], clouds: 3, dim: true, glow: 0, stars: 0, drops: 'shower', flakes: 0, tip: '갑작스러운 소나기에 대비하세요', lohi: [15, 21] },
      'thunderstorm': { ko: '뇌우', tone: [0.8, 0.5], clouds: 3, dim: true, flash: true, glow: 0, stars: 0, drops: 'rain', flakes: 0, tip: '천둥번개가 쳐요, 실내에 머무르세요', lohi: [17, 23] },
      'snow': { ko: '눈', tone: [0.55, 0.9], clouds: 3, glow: 0, stars: 0, drops: null, flakes: 70, tip: '눈이 와요, 길이 미끄러워요', lohi: [-5, 1] },
      'sleet': { ko: '진눈깨비', tone: [0.65, 0.78], clouds: 3, glow: 0, stars: 0, drops: 'sleet', flakes: 32, tip: '진눈깨비가 내려요, 빙판길 조심하세요', lohi: [-1, 3] }
    };
    const weather = W[p.weather] ? p.weather : 'clear';
    const w = W[weather];

    const grey = (c) => { const l = c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11; return this.rgb(this.mix(c, [l, l, l * 1.07], w.tone[0]).map((v) => v * w.tone[1])); };
    const st = T[timeKey].sky.map((c) => grey(this.hex(c)));
    const sky = 'linear-gradient(180deg, ' + st[0] + ' 0%, ' + st[1] + ' 55%, ' + st[2] + ' 100%)';

    const [lo, hi] = w.lohi;
    let x;
    if (hf >= 5 && hf < 15) x = 0.5 - 0.5 * Math.cos(Math.PI * (hf - 5) / 10);
    else { const d = hf >= 15 ? hf - 15 : hf + 9; x = 0.5 + 0.5 * Math.cos(Math.PI * d / 14); }
    const temp = Math.round(lo + (hi - lo) * x);

    const H = Math.floor(hf), Mi = Math.round((hf - H) * 60) % 60;
    const h12 = H % 12 === 0 ? 12 : H % 12;
    const time = (H < 12 ? '오전 ' : '오후 ') + h12 + ':' + String(Mi).padStart(2, '0');
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const dateLabel = k.mo + '월 ' + k.d + '일 ' + days[k.dow < 0 ? 0 : k.dow] + '요일';

    const night = hf < 6.5 || hf >= 18;
    const sp = Math.max(0, Math.min(1, (hf - 6.5) / 11.5));
    const warm = timeKey === 'evening' || timeKey === 'dawn';
    const glowStyle = (night
      ? 'left: 72%; top: 34%; background: radial-gradient(circle, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 60%)'
      : 'left: ' + (12 + sp * 76).toFixed(1) + '%; top: ' + (110 - 90 * Math.sin(Math.PI * sp)).toFixed(0) + 'px; background: radial-gradient(circle, ' + (warm ? 'rgba(255, 170, 110, 0.55)' : 'rgba(255, 238, 170, 0.5)') + ' 0%, rgba(255, 238, 170, 0) 62%)')
      + '; opacity: ' + w.glow;

    let seed = 23;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const stars = [];
    for (let i = 0; i < 60; i++) {
      const sz = (1 + rnd() * 1.4).toFixed(1);
      stars.push({ style: 'left: ' + (rnd() * 100).toFixed(1) + '%; top: ' + (rnd() * 90).toFixed(1) + '%; width: ' + sz + 'px; height: ' + sz + 'px; opacity: ' + (0.35 + rnd() * 0.65).toFixed(2) });
    }

    const D = {
      drizzle: { n: 55, len: [6, 10], dur: [1.0, 1.5], stroke: 'rgba(205, 225, 255, 0.38)', sw: 1, slant: 0 },
      rain: { n: 90, len: [12, 24], dur: [0.45, 0.75], stroke: 'rgba(205, 225, 255, 0.5)', sw: 1.3, slant: 0 },
      shower: { n: 140, len: [18, 32], dur: [0.32, 0.5], stroke: 'rgba(205, 225, 255, 0.6)', sw: 1.5, slant: 0.2 },
      sleet: { n: 45, len: [10, 18], dur: [0.6, 0.9], stroke: 'rgba(205, 225, 255, 0.45)', sw: 1.2, slant: 0 }
    }[w.drops];
    const drops = [];
    if (D) {
      for (let i = 0; i < D.n; i++) {
        const len = D.len[0] + rnd() * (D.len[1] - D.len[0]);
        const dur = D.dur[0] + rnd() * (D.dur[1] - D.dur[0]);
        const dx = D.slant * 250;
        drops.push({
          left: (rnd() * 104 - 2).toFixed(1) + '%', len: len.toFixed(0), x2: (2 - len * D.slant).toFixed(1),
          stroke: D.stroke, sw: D.sw, from: (dx * 0.15).toFixed(0) + ' -30', to: (-dx).toFixed(0) + ' 240',
          dur: dur.toFixed(2) + 's', begin: '-' + (rnd() * dur).toFixed(2) + 's'
        });
      }
    }
    const flakes = [];
    for (let i = 0; i < w.flakes; i++) {
      const dur = 4 + rnd() * 4;
      flakes.push({ left: (rnd() * 100).toFixed(1) + '%', r: (1.3 + rnd() * 1.8).toFixed(1), to: ((rnd() - 0.5) * 40).toFixed(0) + ' 215', dur: dur.toFixed(1) + 's', begin: '-' + (rnd() * dur).toFixed(1) + 's' });
    }

    const tint = w.dim ? 'rgba(170, 180, 198, ' : 'rgba(255, 255, 255, ';
    const CL = [
      [],
      [[6, -60, 26, 120, 0.13], [58, -50, 24, 110, 0.12]],
      [[-6, -40, 30, 130, 0.17], [30, 20, 26, 110, 0.15], [62, -50, 30, 140, 0.17], [84, 30, 24, 110, 0.15]],
      [[-6, -40, 34, 140, 0.2], [20, 30, 30, 110, 0.18], [44, -50, 36, 150, 0.2], [66, 40, 30, 120, 0.18], [86, -30, 26, 130, 0.2], [30, 120, 40, 100, 0.14]]
    ][w.clouds];
    const clouds = CL.map((c) => ({ style: 'left: ' + c[0] + '%; top: ' + c[1] + 'px; width: ' + c[2] + '%; height: ' + c[3] + 'px; background: ' + tint + c[4] + ')' }));
    const fog = w.fog
      ? [[-10, 30, 70, 46], [30, 70, 80, 52], [-5, 120, 75, 50], [45, 150, 70, 48]].map((f) => ({ style: 'left: ' + f[0] + '%; top: ' + f[1] + 'px; width: ' + f[2] + '%; height: ' + f[3] + 'px; background: rgba(236, 240, 246, 0.24)' }))
      : [];

    const iconKey = weather === 'clear' ? (night ? 'moon' : 'sun')
      : weather === 'few-clouds' ? (night ? 'partMoon' : 'partSun')
      : ({ 'scattered-clouds': 'cloud', 'overcast': 'clouds', 'mist': 'fog', 'drizzle': 'drizzle', 'rain': 'rain', 'shower': 'shower', 'thunderstorm': 'thunder', 'snow': 'snow', 'sleet': 'sleet' })[weather];
    const ic = {};
    ['sun', 'moon', 'partSun', 'partMoon', 'cloud', 'clouds', 'fog', 'drizzle', 'rain', 'shower', 'thunder', 'snow', 'sleet'].forEach((n) => { ic[n] = n === iconKey; });

    return {
      weather, timeKey, sky, dateLabel, time,
      timeLabel: T[timeKey].ko,
      weatherLabel: w.ko,
      greeting: T[timeKey].hello + ' · ' + w.tip,
      temp, lo, hi,
      starsOp: (dark ? w.stars : 0).toFixed(2),
      stars, drops, flakes, clouds, fog,
      showGlow: w.glow > 0, glowStyle,
      hasFlash: !!w.flash,
      ic
    };
  }
}
</script>
